server.port=8080

# Конфігурація локалізації та ресурсних бандлів
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Примусове використання кодування UTF-8 для веб-запитів
spring.web.encoding.enabled=true
spring.web.encoding.force=true
spring.web.encoding.charset=UTF-8

# Налаштування Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.servlet.content-type=text/html

# Зчитування credentials з файлу .env
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8

# Змінні FreeMarker та адміна
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.charset=UTF-8

app.mail.admin=${MAIL_ADMIN}

# H2 Database Config
spring.datasource.url=jdbc:h2:file:./data/booksdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ORM & Hibernate Config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Config
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Flyway Placeholders (передача змінних із .env у SQL-міграції)
spring.flyway.placeholders.mailAdmin=${MAIL_ADMIN:admin@example.com}