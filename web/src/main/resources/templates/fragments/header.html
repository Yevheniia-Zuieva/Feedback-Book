<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="header" style="background-color:#f4f4f4; padding:10px; margin-bottom:15px; border-bottom: 1px solid #ccc;">
    <span>
        <span th:text="#{label.currentTime}"></span> <strong th:text="${currentTime}"></strong>
    </span>

    <!-- Перемикач мов -->
    <span style="margin-left: 20px;">
        <a th:href="@{''(lang='uk')}">UA</a> | 
        <a th:href="@{''(lang='en')}">EN</a> | 
        <a th:href="@{''(lang='fr')}">FR</a>
    </span>

    <span style="float:right;">
        <span sec:authorize="isAuthenticated()">
            <span th:text="#{label.welcome}"></span> 
            <strong th:text="${currentUserNickname != null ? currentUserNickname : #authentication.name}"></strong>!
            [<a th:href="@{/logout}" th:text="#{label.logout}"></a>]
        </span>
        <span sec:authorize="isAnonymous()">
            [<a th:href="@{/login}" th:text="#{label.loginBtn}"></a>] 
            [<a th:href="@{/register}" th:text="#{label.registerBtn}"></a>]
        </span>
    </span>
</div>

</body>
</html>
