<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{title.register}"></title>
</head>
<body style="font-family: sans-serif; margin: 30px;">
<h1 th:text="#{title.register}"></h1>

<div th:if="${error}" style="color:red; margin-bottom: 10px;" th:text="${error}"></div>

<form th:action="@{/register}" th:object="${user}" method="post">
    <div style="margin-bottom: 10px;">
        <label th:text="#{label.email}"></label><br/>
        <input type="email" th:field="*{email}" style="width: 250px;" />
        <br/><span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></span>
    </div>
    <div style="margin-bottom: 10px;">
        <label th:text="#{label.nickname}"></label><br/>
        <input type="text" th:field="*{nickname}" style="width: 250px;" />
    </div>
    <div style="margin-bottom: 10px;">
        <label th:text="#{label.password}"></label><br/>
        <input type="password" th:field="*{password}" style="width: 250px;" />
        <br/><span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></span>
    </div>
    <button type="submit" th:text="#{label.registerBtn}"></button>
</form>

<p>
    <span th:text="#{label.haveAccount}"></span> 
    <a th:href="@{/login}" th:text="#{label.loginBtn}"></a>
</p>
</body>
</html>
