<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${book?.title != null ? book.title : 'Коментарі'}">Коментарі</title>
</head>
<body>

<!-- Підключення блоку панелі з шапки -->
<div th:replace="~{fragments/header :: header}"></div>

<h1>
    <span th:text="#{title.comments}">Коментарі до книги</span>: 
    <span th:text="${book?.title}"></span>
</h1>

<p th:if="${#lists.isEmpty(comments)}" th:text="#{label.noComments}">Коментарів поки немає.</p>

<ul th:if="${!#lists.isEmpty(comments)}">
    <li th:each="comment : ${comments}" style="margin-bottom: 8px;">
        <strong th:text="${comment.author}"></strong>: 
        <span th:text="${comment.text}"></span>

        <!-- Форма видалення коментаря для ADMIN -->
        <form sec:authorize="hasRole('ADMIN')" th:action="@{/comments/delete}" method="post" style="display:inline; margin-left: 10px;">
            <input type="hidden" name="bookId" th:value="${book.id}">
            <input type="hidden" name="commentId" th:value="${comment.id}">
            <input type="hidden" name="createdAt" th:value="${comment.createdAt}">
            <button type="submit" th:text="#{label.delete}" style="color: red; background: none; border: none; cursor: pointer; text-decoration: underline;">
                Видалити
            </button>
        </form>
    </li>
</ul>

<h2><span th:text="#{label.addComment}">Додати коментар</span></h2>
<form th:action="@{/comments}" method="post">
    <input type="hidden" name="bookId" th:value="${book?.id}">
    <label>
        <span th:text="#{label.author}">Автор</span>:
        <input type="text" name="author" required>
    </label><br><br>
    <label>
        <span th:text="#{label.comment}">Коментар</span>:<br>
        <textarea name="text" required></textarea>
    </label><br><br>
    <button type="submit" th:text="#{label.add}">Додати</button>
</form>

<p style="margin-top: 20px;"><a th:href="@{/books}">← <span th:text="#{label.backToBooks}">Назад до каталогу</span></a></p>

</body>
</html>
