server.port=8080

# Конфігурація локалізації та ресурсних бандлів
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Примусове використання кодування UTF-8 для веб-запитів
spring.web.encoding.enabled=true
spring.web.encoding.force=true
spring.web.encoding.charset=UTF-8

# Налаштування Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.servlet.content-type=text/html

# Зчитування credentials з файлу .env
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8

# Змінні FreeMarker та адміна
spring.freemarker.template-loader-path=classpath:/templates/
spring.freemarker.charset=UTF-8

app.mail.admin=${MAIL_ADMIN}